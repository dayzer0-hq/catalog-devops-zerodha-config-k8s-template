# ⚠️ EVERYTHING HARDCODED, AS IT IS TODAY — including a credential, in a manifest, in git.
#
# There are three environments and three copies of this file in real life. Your work is to make
# ONE image tag serve all three, with what differs held outside the image and outside the
# Deployment.
#
# The secret below is an obvious placeholder, not a real credential.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: console
  labels: { app: console }
spec:
  replicas: 2
  selector:
    matchLabels: { app: console }
  template:
    metadata:
      labels: { app: console }
    spec:
      containers:
        - name: console
          image: console:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: ENVIRONMENT
              value: "staging"
            - name: MARKET_OPEN_IST
              value: "09:15"
            - name: MAX_WATCHLIST_SIZE
              value: "50"
            - name: FEATURE_BASKET_ORDERS
              value: "false"
            - name: DATABASE_URL
              value: "postgresql://console:EXAMPLE-NOT-A-REAL-PASSWORD@db:5432/console"
            - name: BROKER_API_SECRET
              value: "EXAMPLE-NOT-A-REAL-SECRET-0000"
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: console
spec:
  selector: { app: console }
  ports:
    - port: 80
      targetPort: 8080
